# =============================================================================
# 배포 목적지 주의 (2026-09-11 신설)
#   접속 정보 AZURE_PROD_HOST / _PORT / _USER / _SSH_KEY 는 **운영 서버(애저) 전용**이다.
#   다른 서버로 보내려고 이 칸의 값을 덮어쓰지 마라.
#     2026-09-07 덮어쓰기로 운영 서버로 배포할 길이 사라졌고,
#     2026-09-10 배포가 성공 표시를 받고도 운영이 아닌 곳으로 갔다.
#   새 서버(벌쳐)로 보낼 때는 VULTR_PROD_* 칸과 아래 workflow_dispatch 의
#   destination 선택을 쓴다. main 에 올리면 항상 운영 서버로 간다.
# =============================================================================
name: Deployment to production

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "middleware.ts"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "tsconfig.json"
      - "postcss.config.mjs"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/**"
      - "deploy/**"
  workflow_dispatch:
    inputs:
      destination:
        description: "배포 목적지 - 기본값은 운영 서버(애저). 새 서버로 보낼 때만 vultr-new 로 바꾼다"
        type: choice
        required: false
        default: azure-production
        options:
          - azure-production
          - vultr-new
      dry_run:
        description: "확인만 하고 배포하지 않음 - 목적지만 로그에 찍고 종료"
        type: boolean
        required: false
        default: false

concurrency:
  group: geotracker-production-deploy-${{ github.ref }}
  cancel-in-progress: false # prod는 진행 중 실행 유지 (안전성)

permissions:
  contents: read
  packages: write

env:
  IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/magicbody-geo-tracker

jobs:
  # -- 배포 목적지를 먼저 밝히고 기록에 남긴다 (2026-09-11 신설) ------------------
  #   목적지 해석 규칙: 입력값이 **정확히 'vultr-new'** 일 때만 새 서버다.
  #   빈 값 - main push - 오타 - API 호출 등 그 밖의 모든 경우는 **운영 서버(애저)** 로 간다.
  #   아무 생각 없이 눌러도 운영으로 가게 하는 것이 이 표현식의 목적이다.
  announce_destination:
    name: "배포 목적지 확인"
    runs-on: ubuntu-latest
    steps:
      - name: "목적지 해석 + 접속 정보 존재 확인 (fail-closed)"
        env:
          DEST_INPUT: ${{ github.event.inputs.destination }}
          DEST_PREFIX: ${{ github.event.inputs.destination == 'vultr-new' && 'VULTR_PROD' || 'AZURE_PROD' }}
          DEST_LABEL: ${{ github.event.inputs.destination == 'vultr-new' && '새 서버(벌쳐 서울)' || '운영 서버(애저)' }}
          DEST_HOST: ${{ secrets[format('{0}_HOST', github.event.inputs.destination == 'vultr-new' && 'VULTR_PROD' || 'AZURE_PROD')] }}
          DEST_PORT: ${{ secrets[format('{0}_PORT', github.event.inputs.destination == 'vultr-new' && 'VULTR_PROD' || 'AZURE_PROD')] }}
          DEST_USER: ${{ secrets[format('{0}_USER', github.event.inputs.destination == 'vultr-new' && 'VULTR_PROD' || 'AZURE_PROD')] }}
          DEST_KEY: ${{ secrets[format('{0}_SSH_KEY', github.event.inputs.destination == 'vultr-new' && 'VULTR_PROD' || 'AZURE_PROD')] }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -eu
          echo "=================================================================="
          echo "  배포 목적지 : ${DEST_LABEL}"
          echo "  접속 정보 칸 : ${DEST_PREFIX}_HOST / _PORT / _USER / _SSH_KEY"
          echo "  실행 방식   : ${GITHUB_EVENT_NAME} (선택값 '${DEST_INPUT:-없음/기본값 운영}')"
          echo "  확인만 하기 : ${DRY_RUN:-false}"
          echo "=================================================================="
          MISSING=""
          [ -n "${DEST_HOST:-}" ] || MISSING="${MISSING} ${DEST_PREFIX}_HOST"
          [ -n "${DEST_PORT:-}" ] || MISSING="${MISSING} ${DEST_PREFIX}_PORT"
          [ -n "${DEST_USER:-}" ] || MISSING="${MISSING} ${DEST_PREFIX}_USER"
          [ -n "${DEST_KEY:-}" ]  || MISSING="${MISSING} ${DEST_PREFIX}_SSH_KEY"
          if [ -n "${MISSING}" ]; then
            echo "::error::접속 정보가 비어 있어 배포를 중단한다(fail-closed):${MISSING}"
            exit 1
          fi
          {
            echo "## 배포 목적지 - ${DEST_LABEL}"
            echo ""
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| 목적지 | ${DEST_LABEL} |"
            echo "| 접속 정보 칸 | ${DEST_PREFIX}_* |"
            echo "| 실행 방식 | ${GITHUB_EVENT_NAME} |"
            echo "| 선택값 | ${DEST_INPUT:-없음 (기본값 운영)} |"
            echo "| 확인만 하기 | ${DRY_RUN:-false} |"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy_auto:
    needs: announce_destination
    if: github.event_name != 'workflow_dispatch' && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker build & push
        env:
          FB_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY || 'AIzaSyAd3yrWQSRWp97eEP5EwiafYDY0mpEfBLA' }}
          FB_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'classnaom.firebaseapp.com' }}
          FB_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'classnaom' }}
          FB_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET || 'classnaom.appspot.com' }}
          FB_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || '1014101877161' }}
          FB_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID || '1:1014101877161:web:b155683e62af755cbfa4b8' }}
        run: |
          DEPLOY_TAG="prod-${GITHUB_SHA}"
          CACHE_TAG="prod-cache"
          IMAGE_REPO_LC=$(echo "${IMAGE_REPO}" | tr '[:upper:]' '[:lower:]')
          DOCKER_BUILDKIT=1 docker build \
            --no-cache \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="${FB_API_KEY}" \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="${FB_AUTH_DOMAIN}" \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="${FB_PROJECT_ID}" \
            --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET="${FB_STORAGE_BUCKET}" \
            --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID="${FB_MESSAGING_SENDER_ID}" \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="${FB_APP_ID}" \
            -t ${IMAGE_REPO_LC}:${DEPLOY_TAG} \
            -t ${IMAGE_REPO_LC}:${CACHE_TAG} .
          docker push ${IMAGE_REPO_LC}:${DEPLOY_TAG}
          docker push ${IMAGE_REPO_LC}:${CACHE_TAG}
          echo "IMAGE_REPO_LC=${IMAGE_REPO_LC}" >> $GITHUB_ENV

      - name: SSH to target server and deploy
        uses: appleboy/ssh-action@master
        env:
          # 배포 로그에 목적지를 남기기 위해 서버로 함께 넘긴다(아래 envs 목록에도 있어야 도달한다).
          DEPLOY_DEST_PREFIX: ${{ github.event.inputs.destination == 'vultr-new' && 'VULTR_PROD' || 'AZURE_PROD' }}
          FILE_PATH: "/datadrive/apps/geo-tracker/docker-compose.yml"
          CONTAINER_NAME: "mbd-geo-tracker"
          # worker 는 앱과 같은 이미지를 쓰지만 지금까지 앱만 재생성해 옛 이미지(08-04)에 머물렀다.
          # 상태가 없는 프로세스(1분마다 tick 호출)라 함께 재생성해도 부작용이 없다 — 계획 geotracker-collect-speed-260924 Step 6.
          # DB(mbd-geo-tracker-db)는 의존 서비스라 재생성 대상이 아니다(--always-recreate-deps 미사용).
          WORKER_SERVICE: "mbd-geo-tracker-worker"
          ENV_FILE: "/datadrive/apps/geo-tracker/.env"
          # 최고관리자 인증 시크릿 — 값은 GitHub Secrets 에서만 (평문 커밋 금지).
          # 미설정(빈 값)이면 기존 .env 값을 보존한다(부분 롤아웃 안전).
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          # ── 이탈자 조회 전용 열쇠 — plan-v2 §3 결정 2 (task_id: magicbody-abandoner-view-2026-07-17) ──
          #   서버 라우트가 .NET /api/Retarget/* 를 부를 때 X-Retarget-Key 헤더로 보낸다.
          #   ⚠️ **MagicBody-API repo 의 같은 이름 Secret 과 같은 값**이어야 한다 — 양쪽이 이 값으로 대조한다.
          #   ⚠️ NEXT_PUBLIC_ 접두사를 절대 붙이지 말 것 — 붙이면 브라우저 번들로 인라인돼
          #      AppID/AppKey 와 똑같은 사고가 난다(그게 애초에 이 열쇠를 만든 이유다).
          #   미설정(빈 값)이면 upsert_env 가 건너뛰어 기존 .env 값을 보존한다. 값이 아예 없으면
          #     cms-api 가 호출 자체를 막고(32자 검사) 화면은 "서버 설정 오류"를 띄운다(fail-closed).
          RETARGET_API_KEY: ${{ secrets.RETARGET_API_KEY }}
        with:
          host: ${{ secrets[format('{0}_HOST', github.event.inputs.destination == 'vultr-new' && 'VULTR_PROD' || 'AZURE_PROD')] }}
          port: ${{ secrets[format('{0}_PORT', github.event.inputs.destination == 'vultr-new' && 'VULTR_PROD' || 'AZURE_PROD')] }}
          username: ${{ secrets[format('{0}_USER', github.event.inputs.destination == 'vultr-new' && 'VULTR_PROD' || 'AZURE_PROD')] }}
          key: ${{ secrets[format('{0}_SSH_KEY', github.event.inputs.destination == 'vultr-new' && 'VULTR_PROD' || 'AZURE_PROD')] }}
          timeout: 30s
          command_timeout: 20m
          envs: DEPLOY_DEST_PREFIX,FILE_PATH,CONTAINER_NAME,WORKER_SERVICE,IMAGE_REPO_LC,ENV_FILE,ADMIN_PASSWORD_HASH,SESSION_SECRET,RETARGET_API_KEY
          script: |
            echo "[deploy target] secrets=${DEPLOY_DEST_PREFIX}_*  server=$(hostname)"
            set -eu
            DEPLOY_TAG="prod-${{ github.sha }}"

            # ── 최고관리자 시크릿을 기존 .env 에 idempotent upsert ──────────────────────
            # docker-compose 의 env_file(/datadrive/apps/geo-tracker/.env)에 이미 다른 변수가 많으므로
            # 전체 덮어쓰기 금지 — 해당 키 라인만 교체/추가한다. 값이 비면 건너뛰어 기존 값 보존.
            upsert_env() {
              # $1=키 $2=값. 값은 작은따옴표로 감싸 $ 등 셸 확장·bcrypt '$2b$..' 손상을 막는다.
              key="$1"; val="$2"
              [ -z "${val}" ] && return 0
              touch "${ENV_FILE}"; chmod 600 "${ENV_FILE}"
              # 기존 동일 키 라인 제거 후 새 라인 추가(주석 '#key=' 는 보존).
              tmp="$(mktemp)"
              grep -v "^${key}=" "${ENV_FILE}" > "${tmp}" || true
              # 값 안의 작은따옴표를 이스케이프('\'') 하여 안전하게 감싼다.
              esc=$(printf '%s' "${val}" | sed "s/'/'\\\\''/g")
              printf "%s='%s'\n" "${key}" "${esc}" >> "${tmp}"
              mv "${tmp}" "${ENV_FILE}"
              chmod 600 "${ENV_FILE}"
            }
            upsert_env "ADMIN_PASSWORD_HASH" "${ADMIN_PASSWORD_HASH}"
            upsert_env "SESSION_SECRET" "${SESSION_SECRET}"
            upsert_env "RETARGET_API_KEY" "${RETARGET_API_KEY}"
            # ───────────────────────────────────────────────────────────────────────────

            # ── 배포 전 디스크 게이트 (fail-closed) ─────────────────────────────────
            # 이미지를 내려받기 전에 여유를 확인한다. 부족하면 여기서 배포를 멈춘다.
            # ⚠️ `A && B || C` 로 쓰면 게이트가 정상 차단(exit 1)해도 || 가 발동해 fallback 으로
            #    흘러가 통과한다. 그래서 && / || 연쇄를 쓰지 않고 if/else 로만 분기한다.
            if [ -x /usr/local/bin/mbd-disk-preflight.sh ]; then
              if /usr/local/bin/mbd-disk-preflight.sh; then
                :
              else
                PF_RC=$?
                echo "disk preflight blocked this deploy (exit=$PF_RC)" >&2
                exit "$PF_RC"
              fi
            else
              # 게이트 스크립트가 아직 설치되지 않은 상태 — 임계를 85% 로 강화한 축소 판정.
              # 측정에 실패하면 통과가 아니라 차단이다.
              PF_USE=$(df -P / | awk 'NR==2 {gsub(/%/,"",$5); print $5}')
              case "$PF_USE" in ''|*[!0-9]*) echo "disk measure failed (preflight missing)" >&2; exit 2 ;; esac
              if [ "$PF_USE" -ge 85 ]; then
                echo "root disk ${PF_USE}% >= 85% and preflight script missing — deploy blocked" >&2
                exit 1
              fi
            fi
            # ────────────────────────────────────────────────────────────────────────
            docker pull ${IMAGE_REPO_LC}:${DEPLOY_TAG}
            docker tag ${IMAGE_REPO_LC}:${DEPLOY_TAG} ${IMAGE_REPO_LC}:latest
            docker compose --file ${FILE_PATH} up -d --force-recreate ${CONTAINER_NAME} ${WORKER_SERVICE}
            # 배포 후 이미지 정리 — 서비스별 최신 10벌 유지. 규칙 정본은 서버 /usr/local/bin/mbd-docker-gc.sh
            # 정리 실패가 배포 실패가 되면 안 되므로 결과는 기록만 하고 배포 결과와 분리한다.
            nohup sh -c 'if [ -x /usr/local/bin/mbd-docker-gc.sh ]; then KEEP=10 /usr/local/bin/mbd-docker-gc.sh; rc=$?; logger -t mbd-deploy "gc exit=$rc"; else logger -t mbd-deploy "gc script MISSING - fallback prune"; docker image prune --force; fi' >/dev/null 2>&1 &

  deploy_manual:
    needs: announce_destination
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker build & push
        env:
          FB_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY || 'AIzaSyAd3yrWQSRWp97eEP5EwiafYDY0mpEfBLA' }}
          FB_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'classnaom.firebaseapp.com' }}
          FB_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'classnaom' }}
          FB_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET || 'classnaom.appspot.com' }}
          FB_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || '1014101877161' }}
          FB_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID || '1:1014101877161:web:b155683e62af755cbfa4b8' }}
        run: |
          DEPLOY_TAG="prod-${GITHUB_SHA}"
          CACHE_TAG="prod-cache"
          IMAGE_REPO_LC=$(echo "${IMAGE_REPO}" | tr '[:upper:]' '[:lower:]')
          docker pull ${IMAGE_REPO_LC}:${CACHE_TAG} 2>/dev/null || true
          DOCKER_BUILDKIT=1 docker build \
            --no-cache \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="${FB_API_KEY}" \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="${FB_AUTH_DOMAIN}" \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="${FB_PROJECT_ID}" \
            --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET="${FB_STORAGE_BUCKET}" \
            --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID="${FB_MESSAGING_SENDER_ID}" \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="${FB_APP_ID}" \
            -t ${IMAGE_REPO_LC}:${DEPLOY_TAG} \
            -t ${IMAGE_REPO_LC}:${CACHE_TAG} .
          docker push ${IMAGE_REPO_LC}:${DEPLOY_TAG}
          docker push ${IMAGE_REPO_LC}:${CACHE_TAG}
          echo "IMAGE_REPO_LC=${IMAGE_REPO_LC}" >> $GITHUB_ENV

      - name: SSH to target server and deploy
        uses: appleboy/ssh-action@master
        env:
          # 배포 로그에 목적지를 남기기 위해 서버로 함께 넘긴다(아래 envs 목록에도 있어야 도달한다).
          DEPLOY_DEST_PREFIX: ${{ github.event.inputs.destination == 'vultr-new' && 'VULTR_PROD' || 'AZURE_PROD' }}
          FILE_PATH: "/datadrive/apps/geo-tracker/docker-compose.yml"
          CONTAINER_NAME: "mbd-geo-tracker"
          # worker 는 앱과 같은 이미지를 쓰지만 지금까지 앱만 재생성해 옛 이미지(08-04)에 머물렀다.
          # 상태가 없는 프로세스(1분마다 tick 호출)라 함께 재생성해도 부작용이 없다 — 계획 geotracker-collect-speed-260924 Step 6.
          # DB(mbd-geo-tracker-db)는 의존 서비스라 재생성 대상이 아니다(--always-recreate-deps 미사용).
          WORKER_SERVICE: "mbd-geo-tracker-worker"
          ENV_FILE: "/datadrive/apps/geo-tracker/.env"
          # 최고관리자 인증 시크릿 — 값은 GitHub Secrets 에서만 (평문 커밋 금지).
          # 미설정(빈 값)이면 기존 .env 값을 보존한다(부분 롤아웃 안전).
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          # ── 이탈자 조회 전용 열쇠 — plan-v2 §3 결정 2 (task_id: magicbody-abandoner-view-2026-07-17) ──
          #   서버 라우트가 .NET /api/Retarget/* 를 부를 때 X-Retarget-Key 헤더로 보낸다.
          #   ⚠️ **MagicBody-API repo 의 같은 이름 Secret 과 같은 값**이어야 한다 — 양쪽이 이 값으로 대조한다.
          #   ⚠️ NEXT_PUBLIC_ 접두사를 절대 붙이지 말 것 — 붙이면 브라우저 번들로 인라인돼
          #      AppID/AppKey 와 똑같은 사고가 난다(그게 애초에 이 열쇠를 만든 이유다).
          #   미설정(빈 값)이면 upsert_env 가 건너뛰어 기존 .env 값을 보존한다. 값이 아예 없으면
          #     cms-api 가 호출 자체를 막고(32자 검사) 화면은 "서버 설정 오류"를 띄운다(fail-closed).
          RETARGET_API_KEY: ${{ secrets.RETARGET_API_KEY }}
        with:
          host: ${{ secrets[format('{0}_HOST', github.event.inputs.destination == 'vultr-new' && 'VULTR_PROD' || 'AZURE_PROD')] }}
          port: ${{ secrets[format('{0}_PORT', github.event.inputs.destination == 'vultr-new' && 'VULTR_PROD' || 'AZURE_PROD')] }}
          username: ${{ secrets[format('{0}_USER', github.event.inputs.destination == 'vultr-new' && 'VULTR_PROD' || 'AZURE_PROD')] }}
          key: ${{ secrets[format('{0}_SSH_KEY', github.event.inputs.destination == 'vultr-new' && 'VULTR_PROD' || 'AZURE_PROD')] }}
          timeout: 30s
          command_timeout: 20m
          envs: DEPLOY_DEST_PREFIX,FILE_PATH,CONTAINER_NAME,WORKER_SERVICE,IMAGE_REPO_LC,ENV_FILE,ADMIN_PASSWORD_HASH,SESSION_SECRET,RETARGET_API_KEY
          script: |
            echo "[deploy target] secrets=${DEPLOY_DEST_PREFIX}_*  server=$(hostname)"
            set -eu
            DEPLOY_TAG="prod-${{ github.sha }}"

            # ── 최고관리자 시크릿을 기존 .env 에 idempotent upsert ──────────────────────
            # docker-compose 의 env_file(/datadrive/apps/geo-tracker/.env)에 이미 다른 변수가 많으므로
            # 전체 덮어쓰기 금지 — 해당 키 라인만 교체/추가한다. 값이 비면 건너뛰어 기존 값 보존.
            upsert_env() {
              # $1=키 $2=값. 값은 작은따옴표로 감싸 $ 등 셸 확장·bcrypt '$2b$..' 손상을 막는다.
              key="$1"; val="$2"
              [ -z "${val}" ] && return 0
              touch "${ENV_FILE}"; chmod 600 "${ENV_FILE}"
              # 기존 동일 키 라인 제거 후 새 라인 추가(주석 '#key=' 는 보존).
              tmp="$(mktemp)"
              grep -v "^${key}=" "${ENV_FILE}" > "${tmp}" || true
              # 값 안의 작은따옴표를 이스케이프('\'') 하여 안전하게 감싼다.
              esc=$(printf '%s' "${val}" | sed "s/'/'\\\\''/g")
              printf "%s='%s'\n" "${key}" "${esc}" >> "${tmp}"
              mv "${tmp}" "${ENV_FILE}"
              chmod 600 "${ENV_FILE}"
            }
            upsert_env "ADMIN_PASSWORD_HASH" "${ADMIN_PASSWORD_HASH}"
            upsert_env "SESSION_SECRET" "${SESSION_SECRET}"
            upsert_env "RETARGET_API_KEY" "${RETARGET_API_KEY}"
            # ───────────────────────────────────────────────────────────────────────────

            # ── 배포 전 디스크 게이트 (fail-closed) ─────────────────────────────────
            # 이미지를 내려받기 전에 여유를 확인한다. 부족하면 여기서 배포를 멈춘다.
            # ⚠️ `A && B || C` 로 쓰면 게이트가 정상 차단(exit 1)해도 || 가 발동해 fallback 으로
            #    흘러가 통과한다. 그래서 && / || 연쇄를 쓰지 않고 if/else 로만 분기한다.
            if [ -x /usr/local/bin/mbd-disk-preflight.sh ]; then
              if /usr/local/bin/mbd-disk-preflight.sh; then
                :
              else
                PF_RC=$?
                echo "disk preflight blocked this deploy (exit=$PF_RC)" >&2
                exit "$PF_RC"
              fi
            else
              # 게이트 스크립트가 아직 설치되지 않은 상태 — 임계를 85% 로 강화한 축소 판정.
              # 측정에 실패하면 통과가 아니라 차단이다.
              PF_USE=$(df -P / | awk 'NR==2 {gsub(/%/,"",$5); print $5}')
              case "$PF_USE" in ''|*[!0-9]*) echo "disk measure failed (preflight missing)" >&2; exit 2 ;; esac
              if [ "$PF_USE" -ge 85 ]; then
                echo "root disk ${PF_USE}% >= 85% and preflight script missing — deploy blocked" >&2
                exit 1
              fi
            fi
            # ────────────────────────────────────────────────────────────────────────
            docker pull ${IMAGE_REPO_LC}:${DEPLOY_TAG}
            docker tag ${IMAGE_REPO_LC}:${DEPLOY_TAG} ${IMAGE_REPO_LC}:latest
            docker compose --file ${FILE_PATH} up -d --force-recreate ${CONTAINER_NAME} ${WORKER_SERVICE}
            # 배포 후 이미지 정리 — 서비스별 최신 10벌 유지. 규칙 정본은 서버 /usr/local/bin/mbd-docker-gc.sh
            # 정리 실패가 배포 실패가 되면 안 되므로 결과는 기록만 하고 배포 결과와 분리한다.
            nohup sh -c 'if [ -x /usr/local/bin/mbd-docker-gc.sh ]; then KEEP=10 /usr/local/bin/mbd-docker-gc.sh; rc=$?; logger -t mbd-deploy "gc exit=$rc"; else logger -t mbd-deploy "gc script MISSING - fallback prune"; docker image prune --force; fi' >/dev/null 2>&1 &
