name: Verify youtube match (manual)

# 수동 트리거 전용 — 인용된 유튜브 영상 중 우리 채널 영상에 매칭되는 규모(읽기 전용).

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: SSH to Azure VM and run verify
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.AZURE_PROD_HOST }}
          port: ${{ secrets.AZURE_PROD_PORT }}
          username: ${{ secrets.AZURE_PROD_USER }}
          key: ${{ secrets.AZURE_PROD_SSH_KEY }}
          timeout: 30s
          command_timeout: 5m
          script: |
            set -e
            cd /datadrive/apps/geo-tracker
            docker compose exec -T mbd-geo-tracker node scripts/verify-youtube-match.mjs
            echo "Verify step complete."
