name: Diagnose automation provider failures (1회용)

# c2a4e6a 이후 자동 조사가 Gemini 만 성공하는 원인 확인용.
# Bright Data Scrape failed / validation_error 패턴을 운영 컨테이너 로그에서 추출.

on:
  workflow_dispatch:
    inputs:
      tail_lines:
        description: '읽을 로그 라인 수 (기본 5000)'
        required: false
        type: string
        default: '5000'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: SSH and inspect container logs
        uses: appleboy/ssh-action@master
        env:
          TAIL_LINES: ${{ inputs.tail_lines }}
        with:
          host: ${{ secrets.AZURE_PROD_HOST }}
          port: ${{ secrets.AZURE_PROD_PORT }}
          username: ${{ secrets.AZURE_PROD_USER }}
          key: ${{ secrets.AZURE_PROD_SSH_KEY }}
          timeout: 30s
          command_timeout: 3m
          envs: TAIL_LINES
          script: |
            set -e
            echo "===== 컨테이너 상태 ====="
            docker ps --filter name=mbd-geo-tracker --format 'table {{.Names}}\t{{.Status}}\t{{.RunningFor}}'

            echo ""
            echo "===== [automation] 로그 — provider 실패 패턴 (최근 $TAIL_LINES 줄) ====="
            docker logs --tail "$TAIL_LINES" mbd-geo-tracker 2>&1 | grep -E "\[automation\]" | tail -80 || echo "[로그 없음]"

            echo ""
            echo "===== Bright Data Scrape failed / validation_error ====="
            docker logs --tail "$TAIL_LINES" mbd-geo-tracker 2>&1 | grep -E "Scrape failed|validation_error|Invalid input|Snapshot failed" | tail -40 || echo "[해당 로그 없음]"

            echo ""
            echo "===== provider 별 실패 카운트 ====="
            for P in chatgpt perplexity copilot gemini google_ai grok; do
              CNT=$(docker logs --tail "$TAIL_LINES" mbd-geo-tracker 2>&1 | grep -E "provider=$P 실패" | wc -l)
              echo "$P: $CNT 회 실패"
            done

            echo ""
            echo "===== cron tick 완료 요약 ====="
            docker logs --tail "$TAIL_LINES" mbd-geo-tracker 2>&1 | grep -E "\[cron/tick\] 완료" | tail -10 || echo "[완료 로그 없음]"

            echo ""
            echo "===== worker 컨테이너 최근 ====="
            docker logs --tail 50 mbd-geo-tracker-worker 2>&1 | tail -30 || echo "[worker 로그 없음]"
