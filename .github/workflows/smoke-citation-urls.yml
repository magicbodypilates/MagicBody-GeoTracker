name: Smoke citation-urls (manual)

# 수동 트리거 전용 — "인용 출처 URL 드릴다운" 신규 조회가 운영 DB에서 실제로 도는지 확인.
# 앱 컨테이너 안에서 읽기 전용 스크립트 실행 (데이터 변경 없음).

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: SSH to Azure VM and run smoke
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AZURE_PROD_HOST }}
          port: ${{ secrets.AZURE_PROD_PORT }}
          username: ${{ secrets.AZURE_PROD_USER }}
          key: ${{ secrets.AZURE_PROD_SSH_KEY }}
          timeout: 30s
          command_timeout: 5m
          script: |
            set -e
            cd /datadrive/apps/geo-tracker
            docker compose exec -T mbd-geo-tracker node scripts/smoke-citation-urls.mjs
            echo "Smoke step complete."
