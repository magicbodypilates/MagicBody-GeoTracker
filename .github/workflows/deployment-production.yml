          RETARGET_API_KEY: ${{ secrets.RETARGET_API_KEY }}
        with:
          host: ${{ secrets.AZURE_PROD_HOST }}
          port: ${{ secrets.AZURE_PROD_PORT }}
          username: ${{ secrets.AZURE_PROD_USER }}
          key: ${{ secrets.AZURE_PROD_SSH_KEY }}
          timeout: 30s
          command_timeout: 20m
          envs: FILE_PATH,CONTAINER_NAME,IMAGE_REPO_LC,ENV_FILE,ADMIN_PASSWORD_HASH,SESSION_SECRET,RETARGET_API_KEY
          script: |
            set -eu
            DEPLOY_TAG="prod-${{ github.sha }}"

